services:
  - type: web
    name: siac-sg
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: "off"
    envVars:
      - key: APP_NAME
        value: SIAC-SG
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: siac-sg-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_LIFETIME
        value: "15"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SIAC_SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true

databases:
  - name: siac-sg-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: siac_sg
    user: siac_sg
    ipAllowList: []
